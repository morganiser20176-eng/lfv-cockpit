name: Installeur Windows

# Fabrique l'installeur LFV-Cockpit-Setup-x.y.z.exe.
#
# Volontairement PAS à chaque push : le temps de calcul GitHub est partagé
# avec les déploiements du site Les Fous Volants. Seulement à la publication
# d'une version (tag vX.Y.Z) ou à la main (onglet Actions).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installeur-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installeur:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Fabriquer l'installeur
        run: npx electron-builder --win nsis --publish never

      - name: Mettre l'installeur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: LFV-Cockpit-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
